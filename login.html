<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Apoia+</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="nav">
<a class="brand" href="index.html">APOIA+<span>Plataforma de oportunidades</span></a>
<button class="menuToggle" id="menuToggle" aria-label="Abrir menu">☰</button>
<nav class="navlinks">
<a href="index.html" data-i18n="nav_inicio">Início</a>
<a href="index.html#servicos" data-i18n="nav_servicos">Serviços</a>
<a href="cursos.html" data-i18n="nav_cursos">Cursos</a>
<a href="organizacao.html" data-i18n="nav_organizacoes">Organizações</a>
<a href="index.html#sobre" data-i18n="nav_sobre">Sobre</a>
</nav>
<select class="lang" id="langSelect" aria-label="Idioma">
<option value="pt">Português</option>
<option value="es">Español</option>
<option value="en">English</option>
<option value="fr">Français</option>
<option value="ar">العربية</option>
</select>
<div id="authSlot"></div>
</div></header>

<div class="authwrap">
<div class="authbox">
<div class="eyebrow" data-i18n="login_eyebrow">Bem-vindo de volta</div>
<h1 data-i18n="login_title">Entrar na plataforma</h1>
<p class="sub" id="loginMsg" data-i18n="login_sub">Acesse seu perfil, cursos e agenda.</p>
<form id="loginForm">
<label data-i18n="label_nome_proto">Nome (para o protótipo)</label>
<input id="loginNome" placeholder="Como podemos te chamar?" required>
<label data-i18n="label_email_ou_tel">E-mail ou telefone</label>
<input id="loginEmail" placeholder="voce@exemplo.com" required>
<label data-i18n="label_senha">Senha</label>
<input id="loginSenha" type="password" placeholder="••••••••" required>
<div class="row" style="margin-top:12px">
<label class="checkline" style="margin-top:0"><input type="checkbox"><span data-i18n="remember_me">Lembrar de mim</span></label>
<a href="#" style="font-size:13px;color:var(--green);font-weight:700;text-decoration:none" data-i18n="forgot_pass">Esqueci minha senha</a>
</div>
<button class="btn primary block" style="margin-top:20px" type="submit" data-i18n="btn_entrar">Entrar</button>
</form>
<div class="divider" data-i18n="or_divider">ou</div>
<button class="btn ghost block" id="orgLoginBtn" data-i18n="btn_org_login">Entrar como organização</button>
<div class="authfoot"><span data-i18n="no_account">Ainda não tem cadastro?</span> <a href="cadastro.html" style="color:var(--green);font-weight:700;text-decoration:none" data-i18n="criar_conta">Criar conta</a></div>
</div>
</div>

<footer class="footer"><div class="footerin"><div><b>APOIA+</b><div style="margin-top:8px;font-size:13px" data-i18n="footer_desc">Plataforma de oportunidades e apoio.</div></div><div style="font-size:13px"><span data-i18n="footer_links">Privacidade · Termos · Ajuda</span> · <a href="admin.html" style="color:inherit;text-decoration:underline">Admin</a></div></div></footer>

<script src="app.js"></script>
<script>
(function(){
  const existing = CARITAS.getUser();
  if(existing){ document.getElementById('loginNome').value = existing.nome || ''; document.getElementById('loginEmail').value = existing.email || ''; }
})();
document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  const nome = document.getElementById('loginNome').value.trim() || 'Participante';
  const email = document.getElementById('loginEmail').value.trim();
  const existing = CARITAS.getUser();
  CARITAS.setUser({ nome, email, criadoEm: (existing && existing.email === email) ? existing.criadoEm : new Date().toISOString() });
  const params = new URLSearchParams(location.search);
  location.href = params.get('next') || 'perfil.html';
});
document.getElementById('orgLoginBtn').addEventListener('click', function(){
  const orgs = CARITAS.getOrganizations();
  const org = orgs.length ? orgs[orgs.length - 1] : null;
  if(org){
    CARITAS.setUser({ nome: org.nome, email: org.email, role: 'organization', orgId: org.id, criadoEm: org.createdAt });
  } else {
    CARITAS.setUser({ nome: 'Organização de exemplo', email: 'contato@exemplo.org', role: 'organization', orgId: null, criadoEm: new Date().toISOString() });
  }
  location.href = 'org-painel.html';
});
</script>
</body></html>
